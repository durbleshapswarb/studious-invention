      .emscripten { padding-right: 0; display: block; }

      canvas.emscripten {
        display: none;
        border: 0px none;
        background-color: black;
        position: relative;
        transition: opacity 5s ease-in;
        -webkit-transition: opacity 5s ease-in;
        opacity: 0;
        filter: blur(0) grayscale(0);
        margin-top: auto;
        margin-bottom: auto;
        image-rendering: optimizeSpeed;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: -o-crisp-edges;
        image-rendering: pixelated;
        -ms-interpolation-mode: nearest-neighbor;

      canvas.active { animation-name: fadeIn; animation-duration: 2s; opacity: 1; }
      canvas.paused { animation-name: blur; animation-duration: 0.5s; filter: blur(2px) grayscale(1); }
      canvas.unpaused { animation-name: none; }
      canvas.animatedSizeTransitions { transition: width 0.3s ease, height 0.3s ease; }

      @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
      @keyframes blur { 0% { filter: blur(0) grayscale(0); } 100% { filter: blur(2px) grayscale(1); } }

      .spinner {
        height: 30px; width: 30px;
        -webkit-animation: rotation 0.8s linear infinite;
        -moz-animation: rotation 0.8s linear infinite;
        -o-animation: rotation 0.8s linear infinite;
        animation: rotation 0.8s linear infinite;
        border: 5px solid #bdff00;
        border-top: 5px solid #719900;
        border-radius: 100%;
      }

      .floating-control {
        position: absolute; display: none; border: none;

    <script id="tick-worker" type="javascript/worker">
      let running = false;
      let stop_called = false;
      let intervalMs = 16;

      onmessage = (e) => {
        if (e.data.run) {
          intervalMs = Math.floor(1000 / e.data.fps);
          if (!running) {
            running = true;
            setTimeout(tick, intervalMs);
          }
        } else {
          stop_called = true;
        }
      }

      const tick = () => {
        if (stop_called) {
          stop_called = false;
          running = false;
          return;
        }
        const start = new Date().getTime();
        postMessage('');
        const end = new Date().getTime();
        let next_update = start + intervalMs - end;
        next_update = Math.max(next_update, 0);
        setTimeout(tick, next_update);
      }
    </script>

    <script type="text/javascript">
      const blob = new Blob([document.querySelector('#tick-worker').textContent]);
      const worker = new Worker(window.URL.createObjectURL(blob));

      worker.onmessage = function () {
        GM_tick(performance.now());
      }

      const isMultiplayer = function () {
        if (typeof GM_is_multiplayer !== 'function') {
          return false;
        }
        return GM_is_multiplayer() !== 0;
      }

      document.addEventListener('visibilitychange', function () {
        if (!isMultiplayer()) {
          return;
        }
        if (document.visibilityState === 'hidden') {
          worker.postMessage({run: true, fps: 60});
        } else {
          worker.postMessage({run: false});
        }
      });
    </script>

        var relay_rtt_elem = document.getElementById("stats-network-relay-rtt");
        peers_elem.innerHTML = '';
        frame_delay_elem.innerHTML = '';
        relay_rtt_elem.innerHTML = '';
        stats.peers.forEach(p => {
          drawPeer(peers_elem, frame_delay_elem, 'peer' + p.peer, p.rtt, p.remote_frame_delay, p.local_frames_ahead);
        });
        drawLocal(peers_elem, frame_delay_elem, relay_rtt_elem, 'peer' + stats.peer, stats.relay_rtt, stats.frame_delay);
      }

      let wallpaperConfig = {};
      const wallpaperConfigKey = 'wallpaper-config';

      function wallpaper_init_config_controls(definitions) {
        const wallpaperContainer = document.getElementById("wallpaper-container");
        wallpaperContainer.style.display = "block";
        let configStyle = '<style type="text/css">' +
          'body { color: white; font-family: Averta, -apple-system, "Segoe UI", system-ui, sans-serif; font-style: normal; font-size: 10px; }' +
          '.config-row { display: flex; justify-content: flex-start; align-items: center; padding: .5em; }' +
          '.config-row > label { flex: 1 }' +
          '.config-row > input { flex: initial; }' +
          '.config-row > textarea { flex: 1; }' +
          '.config-row-label { font-size: 12px; font-weight: 600; }' +
          'button { padding: 8px 16px; border-radius: 4px; background-color: unset; border-color: rgb(199, 159, 234); color: rgb(199, 159, 234); }' +
          '</style>';
        let configHTML = '<html><head><title></title>' + configStyle + '</head><body>' +
          '<div class="wallpaper-header"><h1>Live Wallpaper Configurator</h1><button id="wallpaper-reset-parameters">Reset parameters</button></div>' +
          '<div class="wallpaper-config" id="wallpaper-config"></div>' +
          '</body></html>'

        const wallpaperConfigDocument = document.getElementById("wallpaper-config-iframe").contentDocument;
        wallpaperConfigDocument.open();
        wallpaperConfigDocument.write(configHTML);
        wallpaperConfigDocument.close();

        const storedConfig = JSON.parse(localStorage.getItem(wallpaperConfigKey));
        if (storedConfig) {
          wallpaperConfig = storedConfig;
        }

        const configElement = wallpaperConfigDocument.getElementById("wallpaper-config");
        const resetButton = wallpaperConfigDocument.getElementById("wallpaper-reset-parameters");
        resetButton.addEventListener("click", (e) => {
          wallpaper_reset_config();
          wallpaperConfig = {};
          add_config_elems(configElement, definitions);
          notify_config_change();
        }, false);

        add_config_elems(configElement, definitions);
        notify_config_change();
      }

      function add_config_elems(configElement, definitions) {
        while (configElement.hasChildNodes()) {
          configElement.removeChild(configElement.lastChild);
        }
        definitions.value
          .map(d => create_elems(d, wallpaperConfig, ""))
          .filter(e => e !== null && e !== undefined)
          .map(e => configElement.appendChild(e));
      }

      function create_elems(definition, config, prefixId) {
          if (definition.type === undefined || definition.name === undefined) {
            console.log("missing definition name or type for: ", definition);
            return null;
          }
          if  (definition.type === "section") {
            return create_section_elem(definition, config, prefixId);
          }
          if (definition.value === undefined ) {
            console.log("missing definition value for: ", definition);
            return null;
          }
          if (definition.type === "range") { return create_range_elem(definition, config, prefixId); }
          if (definition.type === "boolean") { return create_checkbox_elem(definition, config, prefixId); }
          if (definition.type === "color" || definition.type === "colour") { return create_color_elem(definition, config, prefixId); }
          if (definition.type === "string") { return create_text_elem(definition, config, prefixId); }
          if (definition.type === "string_multiline") { return create_multiline_text_elem(definition, config, prefixId); }
          if (definition.type === "select") { return create_select_elem(definition, config, prefixId); }
          if (definition.type === "file" || definition.type === "folder") { return create_not_supported_elem(definition, config); }
          console.log("missing config value for: ", definition);
          return null;
      }

      function create_section_elem(definition, config, prefixId) {
        const divElem = document.createElement("div");
        const headerElem = document.createElement("h2");
        headerElem.innerHTML = definition.label;
        divElem.appendChild(headerElem);
        const sectionId = prefixId + definition.name + "-"
        if (!config[definition.name]) {
          config[definition.name] = {};
        }
        definition.children
          .map(c => create_elems(c, config[definition.name], sectionId))
          .filter(e => e !== null && e !== undefined)
          .map(e => divElem.appendChild(e));
        return divElem;
      }

      function get_initial_value(definition, config) {
        let value =  definition.value;
        const configValue = config[definition.name];
        if (configValue && (typeof(configValue) === typeof(value))) {
          value = configValue;
        }
        return value;
      }

      function wrap_with_label(inputElem, definition, prefixId) {
        const controlElem = document.createElement("div");
        controlElem.classList.add(definition.name + "-control");
        controlElem.classList.add("config-row");
        const labelElem = document.createElement("label");
        labelElem.htmlFor = prefixId + definition.name;
        labelElem.innerHTML = "<span class='config-row-label'>" + (definition.label || definition.name) + "</span>";
        if (definition.description) {
          labelElem.innerHTML += "<p>" + definition.description + "</p>";
        }
        controlElem.appendChild(labelElem);
        inputElem.id = prefixId + definition.name;
        controlElem.appendChild(inputElem);
        return controlElem;
      }

      function create_range_elem(definition, config, prefixId) {
        const value = get_initial_value(definition, config);
        const valueElem = document.createElement("span");
        valueElem.style = "margin: 0.5em";
        valueElem.innerHTML = "(" + value + ")";
        const stepElem = document.createElement("input");
        stepElem.id = prefixId + definition.name;
        stepElem.type = "range";
        stepElem.min = definition.min || 0;
        stepElem.max = definition.max || 100;
        stepElem.step = definition.step || 1;
        stepElem.value = value;
        config[definition.name] = value;
        function range_value_updated(e) {
          const valueUpdate = Number(e.target.value);
          config[definition.name] = valueUpdate;
          valueElem.innerHTML = "(" + valueUpdate + ")";
          notify_config_change();
        }
        stepElem.addEventListener("change", range_value_updated, false);
        stepElem.addEventListener("input", range_value_updated, false);
        const valueWrapper = document.createElement("span");
        valueWrapper.appendChild(valueElem);
        valueWrapper.appendChild(stepElem);
        return wrap_with_label(valueWrapper, definition, prefixId);
      }

      function create_checkbox_elem(definition, config, prefixId) {
        const value = get_initial_value(definition, config);
        const checkboxElem = document.createElement("input");
        checkboxElem.type = "checkbox";
        checkboxElem.checked = value;
        config[definition.name] = value;
        checkboxElem.addEventListener("change", (e) => {
          const valueUpdate = Boolean(e.target.checked);
          config[definition.name] = valueUpdate;
          notify_config_change();
        });
        return wrap_with_label(checkboxElem, definition, prefixId);
      }

      function create_color_elem(definition, config, prefixId) {
        const value = get_initial_value(definition, config);
        const bgrColor = value;
        const r = (bgrColor & 0x0000ff);
        const g = (bgrColor & 0x00ff00) >> 8;
        const b = (bgrColor & 0xff0000) >> 16;
        const rgbColor = (r << 16) + (g << 8) + b;
        const color = "#" + rgbColor.toString(16).padStart(6, '0');
        const colorElem = document.createElement("input");
        colorElem.type = "color";
        colorElem.value = color;
        config[definition.name] = value;
        function color_value_updated(e) {
          const color = e.target.value;
          const rgbColor = parseInt(color.slice(1), 16);
          const r = (rgbColor & 0xff0000) >> 16;
          const g = (rgbColor & 0x00ff00) >> 8;
          const b = (rgbColor & 0x0000ff);
          const bgrColor = (b << 16) + (g << 8) + r;
          config[definition.name] = bgrColor;
          notify_config_change();
        }
        colorElem.addEventListener("change", color_value_updated, false);
        colorElem.addEventListener("input", color_value_updated, false);
        return wrap_with_label(colorElem, definition, prefixId);
      }

      function create_text_elem(definition, config, prefixId) {
        const value = get_initial_value(definition, config);
        const textElem = document.createElement("input");
        textElem.type = "text";
        textElem.value = value;
        if (definition.max_length && definition.max_length > 0) {
          textElem.maxLength = definition.max_length;
        }
        config[definition.name] = value;
        textElem.addEventListener("input", (e) => {
          config[definition.name] = e.target.value;
          notify_config_change();
        });
        return wrap_with_label(textElem, definition, prefixId);
      }

      function create_multiline_text_elem(definition, config, prefixId) {
        const value = get_initial_value(definition, config);
        const textareaElem = document.createElement("textarea");
        textareaElem.rows = 5;
        textareaElem.cols = 50;
        textareaElem.value = value;
        if (definition.max_length && definition.max_length > 0) {
          textareaElem.maxLength = definition.max_length;
        }
        config[definition.name] = value;
        textareaElem.addEventListener("input", (e) => {
          config[definition.name] = e.target.value;
          notify_config_change();
        });
        return wrap_with_label(textareaElem, definition, prefixId);
      }

      function create_select_elem(definition, config, prefixId) {
        const value = get_initial_value(definition, config);
        const selectElem = document.createElement("select");
        selectElem.value = value;
        const options = definition.options || [];
        options.forEach(o => {
          const option = document.createElement("option");
          option.value = o;
          option.text = o;
          option.selected = o == value ? "selected" : "";
          selectElem.appendChild(option);
        })
        config[definition.name] = value;
        selectElem.addEventListener("change", (e) => {
          e.selected = "selected";
          config[definition.name] = e.target.value;
          notify_config_change();
        });
        return wrap_with_label(selectElem, definition, prefixId);
      }

      function create_not_supported_elem(definition, config, prefixId) {
        const labelElem = document.createElement("label");
        labelElem.innerHTML = "Not supported in browser";
        config[definition.name] = definition.value;
        return wrap_with_label(labelElem, definition, prefixId);
      }

      function notify_config_change() {
        console.log(wallpaperConfig)
        localStorage.setItem(wallpaperConfigKey, JSON.stringify(wallpaperConfig));
        wallpaper_update_config(JSON.stringify(wallpaperConfig));
      }
    </script>

<!-- MOBILE CONTROLS SCRIPT -->
<script>
(function() {
    const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    if (!isTouchDevice) return;

    const hudRoot = document.getElementById("mobileHudRoot");
    const modePill = document.getElementById("mobileModePill");
    const layerGame = document.getElementById("layerGame");
    const layerSalvage = document.getElementById("layerSalvage");
    const roamDpadToggle = document.getElementById("roamDpadToggle");
    const dpadStatus = document.getElementById("dpadStatus");
    const canvas = document.getElementById("canvas");

    hudRoot.style.display = "block";
    
    // Load saved preferences
    let mode = parseInt(localStorage.getItem("touchMode") || "1");
    if (isNaN(mode) || mode < 0 || mode > 1) mode = 1; 
    let roamDpadEnabled = localStorage.getItem("roamDpadEnabled") !== "false";

    const modes = [
        { label: "TOUCH: GAME", layer: layerGame },
        { label: "TOUCH: ROAM", layer: layerSalvage }
    ];

    const activeKeys = new Set();

    // Game State Saving System
    function saveGameState() {
        try {
            let gameData = { timestamp: Date.now() };
            if (typeof obj_player !== 'undefined') {
                gameData.x = obj_player.x; gameData.y = obj_player.y;
            } else if (typeof global !== 'undefined' && typeof global.player_x !== 'undefined') {
                gameData.x = global.player_x; gameData.y = global.player_y;
            }
            localStorage.setItem("gamemaker_save_state", JSON.stringify(gameData));
        } catch(e) {}
    }

    function loadGameState() {
        try {
            let saved = localStorage.getItem("gamemaker_save_state");
            if (saved) {
                let data = JSON.parse(saved);
                if (data.x !== undefined && typeof obj_player !== 'undefined') {
                    obj_player.x = data.x; obj_player.y = data.y;
                } else if (data.x !== undefined && typeof global !== 'undefined' && typeof global.player_x !== 'undefined') {
                    global.player_x = data.x; global.player_y = data.y;
                }
            }
        } catch(e) {}
    }

    setTimeout(loadGameState, 2000); 
    window.addEventListener("beforeunload", saveGameState);
    setInterval(saveGameState, 30000);

    function updateModeUI() {
        modePill.textContent = modes[mode].label;
        
        if (layerGame) layerGame.style.display = (modes[mode].layer === layerGame) ? "block" : "none";
        if (layerSalvage) layerSalvage.style.display = (modes[mode].layer === layerSalvage) ? "block" : "none";
        
        if (roamDpadToggle) {
            roamDpadToggle.style.display = (modes[mode].layer === layerSalvage) ? "flex" : "none";
        }
        
        const joyZone = document.getElementById("joyZone");
        const roamDpad = document.getElementById("roamDpad");
        
        if (joyZone && roamDpad) {
            if (roamDpadEnabled) {
                joyZone.style.display = "block";
                roamDpad.style.display = "none";
            } else {
                joyZone.style.display = "none";
                roamDpad.style.display = "block";
            }
        }
        
        if (dpadStatus) {
            dpadStatus.textContent = roamDpadEnabled ? "JOYSTICK" : "D-PAD";
            dpadStatus.style.color = roamDpadEnabled ? "#bdff00" : "#ff4e4e";
        }
    }
    updateModeUI();

    function setKey(codeStr, keyCode, down) {
        if (down && activeKeys.has(codeStr)) return;
        if (!down && !activeKeys.has(codeStr)) return;
        if (down) activeKeys.add(codeStr); else activeKeys.delete(codeStr);

        const keyMap = { 
            KeyW: "w", KeyA: "a", KeyS: "s", KeyD: "d", 
            KeyZ: "z", KeyX: "x", Escape: "Escape", ShiftLeft: "Shift", Space: " "
        };
        
        const ev = new KeyboardEvent(down ? "keydown" : "keyup", {
            key: keyMap[codeStr] || "",
            code: codeStr,
            keyCode: keyCode,
            which: keyCode,
            bubbles: true,
            cancelable: true
        });
        canvas.focus();
        canvas.dispatchEvent(ev);
        window.dispatchEvent(ev);
        document.dispatchEvent(ev);
    }

    function releaseAll() {
        document.querySelectorAll(".t-btn").forEach(b => b.classList.remove("pressed"));
        [["KeyW",87],["KeyA",65],["KeyS",83],["KeyD",68],["KeyX",88],["Escape",27],["ShiftLeft",16],["Space",32]].forEach(k => setKey(k[0], k[1], false));
    }

    modePill.addEventListener("touchstart", function (e) {
        e.preventDefault();
        e.stopPropagation();
        releaseAll();
        mode = (mode + 1) % modes.length;
        localStorage.setItem("touchMode", mode);
        updateModeUI();
    }, { passive: false });

    roamDpadToggle.addEventListener("touchstart", function (e) {
        e.preventDefault();
        e.stopPropagation();
        roamDpadEnabled = !roamDpadEnabled;
        localStorage.setItem("roamDpadEnabled", roamDpadEnabled);
        updateModeUI();
    }, { passive: false });

    // Handle standard buttons
    document.querySelectorAll(".t-btn").forEach(btn => {
        const codeStr = btn.dataset.key;
        const keyCode = Number(btn.dataset.code);
        const isToggle = btn.classList.contains("toggle-btn");

        if (isToggle) {
            // Toggle Logic (Game Mode Z button)
            btn.addEventListener("touchstart", function (e) {
                e.preventDefault();
                e.stopPropagation();
                const currentlyPressed = activeKeys.has(codeStr);
                if (currentlyPressed) {
                    setKey(codeStr, keyCode, false);
                    btn.classList.remove("active");
                } else {
                    setKey(codeStr, keyCode, true);
                    btn.classList.add("active");
                }
            }, { passive: false });
        } else {
            // Hold Logic (All other buttons)
            btn.addEventListener("touchstart", function (e) {
                e.preventDefault();
                e.stopPropagation();
                btn.classList.add("pressed");
                setKey(codeStr, keyCode, true);
            }, { passive: false });

            const end = function (e) {
                e.preventDefault();
                e.stopPropagation();
                btn.classList.remove("pressed");
                setKey(codeStr, keyCode, false);
            };
            btn.addEventListener("touchend", end, { passive: false });
            btn.addEventListener("touchcancel", end, { passive: false });
        }
    });

    // Touch camera look: drag on the empty right half of ROAM mode.
    // Emits relative mousemove events for game runtimes that consume mouse look.
    let lookTouchId = null;
    let lastLookX = 0, lastLookY = 0;
    function isLookTouch(touch) {
        if (modes[mode].layer !== layerSalvage || touch.clientX < window.innerWidth / 2) return false;
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        return !(target && target.closest && target.closest(".t-btn, #roamDpadToggle, #mobileModePill"));
    }
    document.addEventListener("touchstart", function(e) {
        if (lookTouchId !== null) return;
        for (const t of e.changedTouches) {
            if (isLookTouch(t)) {
                lookTouchId = t.identifier;
                lastLookX = t.clientX;
                lastLookY = t.clientY;
                e.preventDefault();
                break;
            }
        }
    }, { passive: false });
    document.addEventListener("touchmove", function(e) {
        if (lookTouchId === null) return;
        for (const t of e.changedTouches) {
            if (t.identifier !== lookTouchId) continue;
            e.preventDefault();
            const dx = t.clientX - lastLookX;
            const dy = t.clientY - lastLookY;
            lastLookX = t.clientX;
            lastLookY = t.clientY;
            const lookEvent = new MouseEvent("mousemove", {
                bubbles: true, cancelable: true,
                clientX: t.clientX, clientY: t.clientY,
                movementX: dx, movementY: dy, buttons: 1
            });
            canvas.dispatchEvent(lookEvent);
            window.dispatchEvent(lookEvent);
            document.dispatchEvent(lookEvent);
        }
    }, { passive: false });
    function endLookTouch(e) {
        for (const t of e.changedTouches) {
            if (t.identifier === lookTouchId) lookTouchId = null;
        }
    }
    document.addEventListener("touchend", endLookTouch, { passive: false });
    document.addEventListener("touchcancel", endLookTouch, { passive: false });

    // Joystick Logic
    const joyZone = document.getElementById("joyZone");
    const joyBase = document.getElementById("joyBase");
    const joyKnob = document.getElementById("joyKnob");
    let joyTouchId = null, originX = 0, originY = 0;

    joyZone.addEventListener("touchstart", function (e) {
        if (joyTouchId !== null) return;
        e.preventDefault();
        const t = e.changedTouches[0];
        joyTouchId = t.identifier;
        originX = t.clientX;
        originY = t.clientY;
        joyBase.style.left = originX + "px";
        joyBase.style.top = originY + "px";
        joyBase.style.display = "block";
        joyKnob.style.transform = "translate(0px, 0px)";
    }, { passive: false });

    joyZone.addEventListener("touchmove", function (e) {
        if (joyTouchId === null) return;
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
            const t = e.changedTouches[i];
            if (t.identifier !== joyTouchId) continue;
            const dx = t.clientX - originX;
            const dy = t.clientY - originY;
            const maxR = 34;
            const dist = Math.hypot(dx, dy);
            const clamp = dist > maxR ? maxR / dist : 1;

            joyKnob.style.transform = `translate(${dx * clamp}px, ${dy * clamp}px)`;

            const dead = 12;
            setKey("KeyW", 87, dy < -dead);
            setKey("KeyS", 83, dy > dead);
            setKey("KeyA", 65, dx < -dead);
            setKey("KeyD", 68, dx > dead);
        }
    }, { passive: false });

    function endJoy(e) {
        for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === joyTouchId) {
                joyTouchId = null;
                joyBase.style.display = "none";
                setKey("KeyW", 87, false);
                setKey("KeyS", 83, false);
                setKey("KeyA", 65, false);
                setKey("KeyD", 68, false);
            }
        }
    }
    joyZone.addEventListener("touchend", endJoy, { passive: false });
    joyZone.addEventListener("touchcancel", endJoy, { passive: false });
})();
</script>
